<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style></head><body>
<canvas id="c" width="1424" height="600"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d'),W=1424,H=600,INK='#2A1600';
function gold(y0,y1){const q=g.createLinearGradient(0,y0,0,y1);q.addColorStop(0,'#FFF3A8');q.addColorStop(.45,'#F5C33B');q.addColorStop(.55,'#D99A1C');q.addColorStop(1,'#FFE27A');return q}
// border band
const m=14,b=14;
g.lineJoin='round';
g.lineWidth=b+8;g.strokeStyle=INK;g.strokeRect(m,m,W-2*m,H-2*m);
g.lineWidth=b;g.strokeStyle=gold(0,H);g.strokeRect(m,m,W-2*m,H-2*m);
g.lineWidth=2;g.strokeStyle='rgba(255,255,255,.7)';g.strokeRect(m-b/2+2,m-b/2+2,W-2*m+b-4,H-2*m+b-4);
g.lineWidth=3;g.strokeStyle=INK;g.strokeRect(m+b/2+1,m+b/2+1,W-2*m-b-2,H-2*m-b-2);
// ornate corner
function corner(sx,sy){
 g.save();g.translate(sx<0?W:0,sy<0?H:0);g.scale(sx,sy);
 const P=[[0,0],[118,0],[118,18],[60,18],[52,26],[34,26],[26,34],[26,52],[18,60],[18,118],[0,118]];
 g.beginPath();P.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();
 g.lineWidth=8;g.strokeStyle=INK;g.stroke();g.fillStyle=gold(0,118);g.fill();
 // inner bracket
 const Q=[[34,34],[96,34],[96,44],[44,44],[44,96],[34,96]];
 g.beginPath();Q.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.lineWidth=6;g.strokeStyle=INK;g.stroke();g.fillStyle=gold(34,96);g.fill();
 // curls
 for(const [x,y] of [[118,9],[9,118]]){g.beginPath();g.arc(x,y,11,0,7);g.lineWidth=6;g.strokeStyle=INK;g.stroke();g.fillStyle=gold(y-11,y+11);g.fill();g.beginPath();g.arc(x,y,4,0,7);g.fillStyle=INK;g.fill()}
 // gem
 g.save();g.translate(20,20);g.rotate(Math.PI/4);g.beginPath();g.rect(-14,-14,28,28);g.lineWidth=6;g.strokeStyle=INK;g.stroke();
 const gm=g.createLinearGradient(-14,-14,14,14);gm.addColorStop(0,'#B8F2FF');gm.addColorStop(1,'#2A8BE0');g.fillStyle=gm;g.fill();
 g.fillStyle='rgba(255,255,255,.8)';g.fillRect(-9,-9,8,5);g.restore();
 // highlight
 g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=3;g.beginPath();g.moveTo(6,110);g.lineTo(6,6);g.lineTo(110,6);g.stroke();
 g.restore();
}
corner(1,1);corner(-1,1);corner(1,-1);corner(-1,-1);
document.title='done';
</script></body></html>
