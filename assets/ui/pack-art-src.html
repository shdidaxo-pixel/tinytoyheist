<!doctype html>

body.sheet{display:flex;flex-wrap:wrap;gap:16px;padding:16px;background:#2F2F36;width:1300px}
svg{display:block}
body.one svg:not(.defs){display:none}
body.one svg.show{display:block}
</style></head>
