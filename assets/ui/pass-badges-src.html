<!doctype html>
<html><head><meta charset="utf-8"><title>Game pass badges</title>
<!-- Source for the game-pass badges (assets/ui/Pass*.png, 320 px). Render one with ?i=<Name>.

<style>

body.sheet{display:flex;flex-wrap:wrap;gap:20px;padding:20px;background:#2F2F36}
svg{display:block}
body.one svg:not(.defs){display:none}
body.one svg.show{display:block}
</style></head>
