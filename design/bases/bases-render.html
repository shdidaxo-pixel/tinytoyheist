  const start=new URLSearchParams(location.search).get('cam');goCam(CAMS[start]?start:'rowA',true);
}
function resize(){const b=document.getElementById('view').getBoundingClientRect();renderer.setSize(b.width,b.height,false);camera.aspect=b.width/b.height;camera.updateProjectionMatrix()}
let frames=0;
function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime(),dt=Math.min(.05,t-(loop.pt??t));loop.pt=t;
  if(PLAYING){const k=(performance.now()-PLAY0)/1000-.6;setUpgrade(Math.max(0,k));if(k>3.6){PLAY0=performance.now()}}
  roam(dt,t);animated.forEach(f=>f(t));
  if(camAnim){const k=Math.min(1,(performance.now()-camAnim.t0)/camAnim.dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;camera.position.lerpVectors(camAnim.from.p,camAnim.to.p,e);controls.target.lerpVectors(camAnim.from.t,camAnim.to.t,e);if(k>=1)camAnim=null}
  controls.update();renderer.render(scene,camera);if(++frames===40)document.title='ready'}
Promise.all([document.fonts.load('400 60px "Lilita One"'),document.fonts.load('900 30px Nunito')]).catch(()=>{}).then(()=>{
  try{init();loop()}catch(e){document.getElementById('view').insertAdjacentHTML('beforeend','<div class="err">This render needs WebGL, which is turned off in this browser.</div>');console.error(e)}});
})();
</script>
