<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toy Index</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FFC93C}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: 'Nunito', sans-serif; color: #1A1430; background-color: #4B3F7C; background-image: radial-gradient(#5B4E90 1.3px, transparent 1.5px); background-size: 14px 14px">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(12,8,28,0.6)"></div>

  <div role="dialog" aria-label="Toy Index" style="position: absolute; left: 60px; top: 40px; width: 1160px; height: 640px; background: #EEF4FF; border: 5px solid #1A1430; border-radius: 28px; box-shadow: 0 10px 0 #1A1430; display: flex; flex-direction: column; overflow: hidden">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 20px; background: #4DA8FF; border-bottom: 5px solid #1A1430">
      <div style="display: flex; align-items: baseline; gap: 14px">
        <div style="font: 400 40px 'Lilita One', sans-serif; color: #FFFFFF; text-shadow: 0 3px 0 #1A1430">Toy Index</div>
        <div style="font: 900 16px 'Nunito', sans-serif; color: #FFFFFF">{{totalFound}} of 84 toys found</div>
      </div>
      <button aria-label="Close index" style="width: 48px; height: 48px; background: #FF4D5E; color: #FFFFFF; border: 4px solid #1A1430; border-radius: 14px; font: 400 26px 'Lilita One', sans-serif; cursor: pointer">X</button>
    </div>

    <div style="display: flex; gap: 8px; padding: 12px 20px 0">
      <sc-for list="{{rooms}}" as="r" hint-placeholder-count="6">
        <button style="height: 44px; padding: 0 16px; background: {{r.bg}}; color: {{r.fg}}; border: 3px solid #1A1430; border-radius: 12px; font: 400 18px 'Lilita One', sans-serif; display: flex; align-items: center; gap: 8px; cursor: pointer">{{r.name}}<span style="font: 900 13px 'Nunito', sans-serif; opacity: 0.85">{{r.count}}</span></button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; padding: 14px 20px">
      <sc-for list="{{toys}}" as="t" hint-placeholder-count="14">
        <div style="height: 196px; padding: 8px; background: {{t.cardBg}}; border: 4px solid {{t.border}}; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; box-sizing: border-box">
          <div style="align-self: stretch; padding: 2px 0; background: {{t.rarityBg}}; border: 2px solid #1A1430; border-radius: 8px; text-align: center; font: 900 11px 'Nunito', sans-serif; letter-spacing: 0.06em; color: {{t.rarityFg}}">{{t.rarityLabel}}</div>
          <svg aria-hidden="true" width="92" height="84" viewBox="0 0 92 84">
            <ellipse cx="46" cy="76" rx="30" ry="5" fill="rgba(26,20,48,0.18)"/>
            <rect x="{{t.bx}}" y="{{t.by}}" width="{{t.bw}}" height="{{t.bh}}" rx="{{t.br}}" fill="{{t.body}}" stroke="#1A1430" stroke-width="4"/>
            <rect x="{{t.hx}}" y="{{t.hy}}" width="{{t.hw}}" height="{{t.hh}}" rx="{{t.hr}}" fill="{{t.head}}" stroke="#1A1430" stroke-width="4"/>
            <circle cx="{{t.e1}}" cy="{{t.ey}}" r="3.4" fill="#1A1430" opacity="{{t.eyeOp}}"/>
            <circle cx="{{t.e2}}" cy="{{t.ey}}" r="3.4" fill="#1A1430" opacity="{{t.eyeOp}}"/>
            <text x="46" y="{{t.qy}}" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="26" fill="#FFFFFF" opacity="{{t.qOp}}">?</text>
          </svg>
          <div style="font: 400 15px 'Lilita One', sans-serif; text-align: center; line-height: 1.1; color: {{t.nameFg}}">{{t.label}}</div>
          <div style="margin-top: auto; font: 900 13px 'Nunito', sans-serif; color: {{t.moneyFg}}">{{t.money}}</div>
          <div style="font: 700 11px 'Nunito', sans-serif; color: #5B6577">{{t.odds}}</div>
        </div>
      </sc-for>
    </div>

    <div style="margin: auto 20px 18px; padding: 12px 16px; background: #FFFFFF; border: 4px solid #1A1430; border-radius: 18px; display: flex; align-items: center; gap: 18px">
      <div style="flex: none">
        <div style="font: 400 22px 'Lilita One', sans-serif">Bedroom set</div>
        <div style="font: 900 14px 'Nunito', sans-serif; color: #5B6577">{{found}} / 14 found</div>
      </div>
      <div style="flex: 1; height: 26px; background: #E8ECF5; border: 3px solid #1A1430; border-radius: 999px; overflow: hidden">
        <div style="width: {{pct}}%; height: 100%; background: repeating-linear-gradient(45deg, #3DDC97 0px, #3DDC97 12px, #2FC585 12px, #2FC585 24px)"></div>
      </div>
      <div style="flex: none; display: flex; gap: 8px">
        <div style="padding: 6px 10px; background: #FFF3CC; border: 3px solid #1A1430; border-radius: 12px; font: 900 14px 'Nunito', sans-serif">+2% luck</div>
        <div style="padding: 6px 10px; background: #DDFBEA; border: 3px solid #1A1430; border-radius: 12px; font: 900 14px 'Nunito', sans-serif">$25,000</div>
        <div style="padding: 6px 10px; background: #EDE4FF; border: 3px solid #1A1430; border-radius: 12px; font: 900 14px 'Nunito', sans-serif">Title: Bedtime Bandit</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
const RARITY = {
  Common:    { bg: '#D9DEE6', fg: '#3F4458', odds: '1 in 6' },
  Uncommon:  { bg: '#9BEBB8', fg: '#13532C', odds: '1 in 11' },
  Rare:      { bg: '#9CCBFF', fg: '#123E78', odds: '1 in 37' },
  Epic:      { bg: '#D3B2FF', fg: '#4B1A7E', odds: '1 in 109' },
  Legendary: { bg: '#FFD66B', fg: '#6B4500', odds: '1 in 294' },
  Mythic:    { bg: '#FF8C8C', fg: '#6E0E0E', odds: '1 in 3,333' }
};
// shape: r = round, t = tall, w = wide
const TOYS = [
  ['Rubber Duck', 'Common', 2, true, '#FFD43B', '#FFD43B', 'r'],
  ['Sock Puppet', 'Common', 3, true, '#F45B5B', '#FFFFFF', 't'],
  ['Crayon Buddy', 'Common', 4, true, '#3D7BFF', '#3D7BFF', 't'],
  ['Bouncy Ball', 'Common', 5, true, '#FF7AC8', '#FF7AC8', 'r'],
  ['Yo-Yo Kid', 'Uncommon', 10, true, '#E23C3C', '#E23C3C', 'r'],
  ['Night-Light Owl', 'Uncommon', 12, false, '', '', 't'],
  ['Plush Bunny', 'Uncommon', 15, true, '#F6E7CF', '#F6E7CF', 't'],
  ['Glow Star Sticker', 'Rare', 40, true, '#D8FF7A', '#D8FF7A', 'r'],
  ['Paper Plane Pilot', 'Rare', 60, false, '', '', 'w'],
  ['Teddy Knight', 'Rare', 75, true, '#B8BFC9', '#A86A3C', 't'],
  ['Pillow Fort Golem', 'Epic', 220, false, '', '', 'w'],
  ['Music Box Dancer', 'Epic', 300, true, '#FFB6D9', '#FFE3C4', 't'],
  ['Cosmic Teddy', 'Legendary', 1500, false, '', '', 't'],
  ['Galaxy Unicorn Plush', 'Mythic', 15000, false, '', '', 'w']
];
const SHAPE = {
  r: { bx: 22, by: 34, bw: 48, bh: 40, br: 20, hx: 30, hy: 10, hw: 32, hh: 28, hr: 14 },
  t: { bx: 28, by: 36, bw: 36, bh: 38, br: 10, hx: 26, hy: 6, hw: 40, hh: 32, hr: 12 },
  w: { bx: 10, by: 40, bw: 72, bh: 34, br: 12, hx: 56, hy: 18, hw: 28, hh: 26, hr: 10 }
};
const ROOMS = [['Bedroom', '9/14', true], ['Hallway', '3/14', false], ['Kitchen', '0/14', false], ['Living Room', 'Locked', false], ['Garage', 'Locked', false], ['Attic', 'Locked', false]];
class Component extends DCLogic {
  renderVals() {
    const toys = TOYS.map(([name, rarity, money, found, body, head, shape]) => {
      const r = RARITY[rarity], s = SHAPE[shape];
      return {
        ...s,
        found, eyeOp: found ? 1 : 0, qOp: found ? 0 : 1,
        label: found ? name : '???',
        rarityLabel: rarity.toUpperCase(),
        rarityBg: r.bg, rarityFg: r.fg,
        odds: r.odds + ' blankets',
        money: found ? '$' + money.toLocaleString('en-US') + ' /s' : '$? /s',
        body: found ? body : '#1A1430',
        head: found ? head : '#1A1430',
        cardBg: found ? '#FFFFFF' : '#C9CFE0',
        border: found ? '#1A1430' : '#5B6577',
        nameFg: found ? '#1A1430' : '#5B6577',
        moneyFg: found ? '#1F8A57' : '#5B6577',
        e1: s.hx + s.hw * 0.32, e2: s.hx + s.hw * 0.68, ey: s.hy + s.hh * 0.45,
        qy: s.hy + s.hh * 0.78
      };
    });
    const found = toys.filter(t => t.found).length;
    const rooms = ROOMS.map(([name, count, active]) => ({ name, count, bg: active ? '#1A1430' : count === 'Locked' ? '#C9CFE0' : '#FFFFFF', fg: active ? '#FFFFFF' : count === 'Locked' ? '#5B6577' : '#1A1430' }));
    return { toys, rooms, found, totalFound: 12, pct: Math.round(found / 14 * 100) };
  }
}
</script>
</body>
</html>
