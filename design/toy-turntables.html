<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Toy Heist Toy Shelf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* A toy-shop turntable for every voxel toy. Big 3D stage left, spec card right, the shelf (by room set) underneath.
   Every model is drawn from design/toy-data.js, which tools/toys/export-toy-data.pl makes from the same Luau data
   Studio builds from, so what you see here is what the game builds. ?shot=... modes render stills (see SHOTS). */
:root{
  --bg:#EDF1F7; --panel:#FFFFFF; --ink:#172033; --soft:#5B6577; --line:#D3DAE6; --accent:#FF6B3D;
  --stage:#2A3260; --beam:#F4E7B8;
  --common:#8A96A3; --uncommon:#33A35A; --rare:#2F7BD8; --epic:#9246D4; --legendary:#D99A1E; --mythic:#D23B3B; --secret:#E0409A;
  --display:'Fredoka', 'Trebuchet MS', sans-serif; --body:'Figtree', system-ui, sans-serif; --mono:'JetBrains Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131C; --panel:#161E2B; --ink:#E8EDF5; --soft:#9AA6B8; --line:#2A3446; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E131C; --panel:#161E2B; --ink:#E8EDF5; --soft:#9AA6B8; --line:#2A3446; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:28px 56px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:22px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(32px,5vw,50px);line-height:1.02;margin:4px 0 6px;text-wrap:balance}
p{margin:0;max-width:70ch}.lede{color:var(--soft)}
.top{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.stagebox{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--stage);aspect-ratio:4/3;max-width:100%}
#stage{display:block;width:100%;height:100%}
.tag{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:999px;padding:4px 12px;font:600 13px var(--display);white-space:nowrap}
.hint{position:absolute;right:12px;bottom:10px;font:400 12px var(--mono);color:#C9D2F0}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--ink);font:600 13px var(--body);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,.btn{font:500 13px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px}
.btn{cursor:pointer}.btn[aria-pressed="true"]{border-color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:12px;min-width:0}
.card h2{font-family:var(--display);font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:3px 10px;border-radius:999px;width:fit-content}
.pill.secret{background:linear-gradient(90deg,#FF4D5E,#FFB020,#3FD06A,#3DA5FF,#B45CFF)}
.money{font:600 28px var(--display);color:var(--ink)}
.money small{font:400 13px var(--body);color:var(--soft)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dt{color:var(--soft)} dd{margin:0}
.perk{border-left:3px solid var(--accent);padding-left:10px;font-size:14px}
.mutnote{border-left:3px solid var(--line);padding-left:10px;font-size:14px;color:var(--soft)}
h3{font-family:var(--display);font-weight:600;font-size:24px;margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:600 13px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tabs button span{font:400 12px var(--mono);opacity:.7;margin-left:6px}
.shelf{display:grid;gap:18px}
.row{display:grid;gap:8px}
.rowhead{display:flex;align-items:center;gap:10px;font:600 13px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.rowhead i{width:10px;height:10px;border-radius:50%}
.toys{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.toy{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;display:grid;gap:4px;text-align:left;color:var(--ink);font:inherit}
.toy img{width:100%;aspect-ratio:1;border-radius:10px;background:var(--stage);display:block}
.toy b{font:600 14px var(--display);line-height:1.15}
.toy span{font:400 12px var(--mono);color:var(--soft)}
.toy[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.err{padding:24px;color:#C9D2F0}
@media (max-width:820px){.top{grid-template-columns:minmax(0,1fr)}}
/* still mode */
body.shot{padding:0;background:#141936;overflow:hidden}
#sheet{position:fixed;inset:0}
#sheetcv{position:absolute;inset:0;width:100%;height:100%;display:block}
#labels{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;display:grid;justify-items:center;gap:2px;text-align:center;color:#fff;transform:translateX(-50%)}
.lab b{font:600 19px var(--display);text-shadow:0 2px 0 rgba(0,0,0,.45);white-space:nowrap}
.lab span{font:500 12px var(--mono);color:#D9DEF5;white-space:nowrap}
.lab .pill{font-size:11px;padding:2px 9px}
.sheettitle{position:absolute;left:28px;top:18px;color:#fff;font:700 30px var(--display);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.sheettitle small{display:block;font:500 13px var(--mono);color:#C9D2F0;letter-spacing:.06em;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="eyebrow">Tiny Toy Heist · Voxel toys · <span id="count"></span></div>
    <h1>Every toy, on the turntable</h1>
    <p class="lede">Drawn from the same data Studio builds the toys from. Drag to spin, scroll or pinch to zoom. Try a mutation, the floor views (blanket, Flashlight) and the wake-up reveal.</p>
  </header>
  <div class="top">
    <div>
      <div class="stagebox" id="stagebox"><canvas id="stage" aria-label="3D view of the selected toy"></canvas><div class="tag" id="tag" hidden></div><div class="hint">drag to spin</div></div>
      <div class="controls">
        <div class="seg" role="group" aria-label="View">
          <button data-view="awake" aria-pressed="true">Awake</button>
          <button data-view="blanket" aria-pressed="false">Under the blanket</button>
          <button data-view="flash" aria-pressed="false">Flashlight</button>
          <button data-view="reveal" aria-pressed="false">Reveal</button>
        </div>
        <label><span class="lede" style="font-size:13px">Mutation </span><select id="mutation"></select></label>
        <button class="btn" id="fx" aria-pressed="true">Rarity glow on</button>
        <button class="btn" id="mouse" aria-pressed="false">Mouse for scale</button>
        <button class="btn" id="spin" aria-pressed="true">Auto-spin on</button>
      </div>
    </div>
    <div class="card" id="info"></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Room sets"></nav>
  <section class="shelf" id="shelf" aria-label="Toy shelf"></section>
</div>
<div id="sheet" hidden><canvas id="sheetcv"></canvas><div id="labels"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="toy-data.js"></script>
<script>
'use strict';
const WARN = []; { const w0 = console.warn.bind(console); console.warn = (...a) => { WARN.push(a.join(' ')); w0(...a); }; }
/* ================================================================ data ================================================================ */
const TAU = Math.PI * 2, DATA = window.TOY_DATA;
const PAL = DATA.palette.Colors, KITS = DATA.palette.Kits;
const RORDER = DATA.rarities.Order, RCOL = DATA.rarities.Colors, RFX = DATA.rarities.Fx;
const MORDER = DATA.mutations.Order, MUTS = DATA.mutations.List;
const SIZE_TARGET = { S: 8, M: 12, L: 17, G: 25 };          // studs; must match ToyBuilder.SIZE_TARGET
const SIZE_NAME = { S: 'Small', M: 'Medium', L: 'Large', G: 'Giant' };
const RVAR = { Common: '--common', Uncommon: '--uncommon', Rare: '--rare', Epic: '--epic', Legendary: '--legendary', Mythic: '--mythic', Secret: '--secret' };
const TOYS = [], BY_ID = {};
DATA.sets.forEach(s => s.Toys.forEach(t => { t.set = s.Set; t.setName = s.SetName; TOYS.push(t); BY_ID[t.Id] = t; }));
const SETS = DATA.sets.map(s => ({ id: s.Set, name: s.SetName, toys: s.Toys }));
const Q = new URLSearchParams(location.search);
const rand = (a, b) => a + Math.random() * (b - a);
const frac = x => x - Math.floor(x);
const smooth = u => u * u * (3 - 2 * u);
const clamp01 = x => Math.max(0, Math.min(1, x));
const pick = a => a[Math.floor(Math.random() * a.length)];
const money = n => '$' + Number(n).toLocaleString('en-US');
const STAGE_BG = 0x2A3260, FLOOR_COL = 0x404888;

function hexOf(c, id) {
  if (typeof c !== 'string') { console.warn(id + ': bad colour', c); return '#FF00FF'; }
  if (c[0] === '#') return c;
  if (!PAL[c]) { console.warn(id + ': unknown colour ' + c); return '#FF00FF'; }
  return PAL[c];
}

/* Expand a toy's Parts (boxes, kits, groups) into a tree of nodes: { name, pivot, boxes, children }. This mirrors
   ToyBuilder.luau exactly: "m" mirrors a box across z = 0; a Group with an existing name merges into it. */
function expandParts(parts, slots, node, byName, id) {
  for (const p of parts) {
    if (Array.isArray(p)) {
      let [x, y, z, w, h, d, col, flags, rot] = p;
      flags = flags || '';
      if (typeof col === 'string' && col[0] === '$') {
        const v = slots && slots[col.slice(1)];
        if (v == null) { console.warn(id + ': kit slot ' + col + ' not filled'); col = '#FF00FF'; }
        else if (Array.isArray(v)) { col = v[0]; flags += v[1] || ''; }
        else col = v;
      }
      const b = { x, y, z, w, h, d, col: hexOf(col, id), flags, rot };
      node.boxes.push(b);
      if (flags.includes('m')) node.boxes.push({ ...b, z: -(z + d), rot: rot ? [-rot[0], -rot[1], rot[2]] : undefined });
    } else if (p.Kit) {
      if (!KITS[p.Kit]) { console.warn(id + ': unknown kit ' + p.Kit); continue; }
      expandParts(KITS[p.Kit], p.Colors, node, byName, id);
    } else if (p.Group) {
      let g = byName[p.Group];
      if (!g) {
        if (!p.Pivot) console.warn(id + ': group ' + p.Group + ' has no Pivot');
        g = { name: p.Group, pivot: p.Pivot || [0, 0, 0], boxes: [], children: [] };
        node.children.push(g); byName[p.Group] = g;
      }
      expandParts(p.Parts || [], slots, g, byName, id);
    }
  }
}
const SHAPES = {};
function shapeOf(t) {
  if (SHAPES[t.Id]) return SHAPES[t.Id];
  const root = { name: 'Body', pivot: [0, 0, 0], boxes: [], children: [] }, byName = { Body: root };
  expandParts(t.Parts || [], null, root, byName, t.Id);
  const mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9]; let n = 0;
  (function walk(nd) {
    nd.boxes.forEach(b => { n++; const lo = [b.x, b.y, b.z], hi = [b.x + b.w, b.y + b.h, b.z + b.d];
      for (let i = 0; i < 3; i++) { mn[i] = Math.min(mn[i], lo[i]); mx[i] = Math.max(mx[i], hi[i]); } });
    nd.children.forEach(walk);
  })(root);
  const W = mx[0] - mn[0], H = mx[1] - mn[1], Dp = mx[2] - mn[2];
  const metric = Math.max(H, 0.75 * Math.max(W, Dp));
  const scale = (SIZE_TARGET[t.Size] || 12) / metric;
  root.pivot = [(mn[0] + mx[0]) / 2, mn[1], (mn[2] + mx[2]) / 2];
  return (SHAPES[t.Id] = { root, byName, count: n, scale, size: [W * scale, H * scale, Dp * scale] });
}

/* ================================================================ textures ================================================================ */
function canvasTex(size, draw) { const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size); const t = new THREE.CanvasTexture(c); return t; }
const TEX = {
  glow: canvasTex(64, (g, s) => { const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.3, 'rgba(255,255,255,.55)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, s, s); }),
  sparkle: canvasTex(64, (g, s) => { const c = s / 2; g.fillStyle = '#fff'; g.beginPath(); for (let k = 0; k < 8; k++) { const r = k % 2 ? 4 : 30, a = k * Math.PI / 4; g.lineTo(c + Math.cos(a) * r, c + Math.sin(a) * r); } g.fill();
    const r = g.createRadialGradient(c, c, 0, c, c, 14); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, s, s); }),
  star: canvasTex(64, (g, s) => { g.fillStyle = '#fff'; g.shadowColor = '#fff'; g.shadowBlur = 8; g.beginPath(); for (let k = 0; k < 10; k++) { const r = k % 2 ? 11 : 26, a = -Math.PI / 2 + k * Math.PI / 5; g.lineTo(32 + Math.cos(a) * r, 32 + Math.sin(a) * r); } g.fill(); }),
  square: canvasTex(32, (g, s) => { g.fillStyle = '#fff'; g.fillRect(4, 4, 24, 24); g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(4, 22, 24, 6); }),
  smoke: canvasTex(64, (g, s) => { for (let i = 0; i < 7; i++) { const x = 20 + Math.random() * 24, y = 20 + Math.random() * 24, rr = 12 + Math.random() * 10; const r = g.createRadialGradient(x, y, 0, x, y, rr); r.addColorStop(0, 'rgba(255,255,255,.55)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, s, s); } }),
  ring: canvasTex(64, (g, s) => { g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 4; g.beginPath(); g.arc(32, 32, 26, 0, TAU); g.stroke(); g.fillStyle = 'rgba(255,255,255,.12)'; g.beginPath(); g.arc(32, 32, 25, 0, TAU); g.fill(); g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.arc(23, 22, 5, 0, TAU); g.fill(); }),
  snow: canvasTex(64, (g, s) => { g.strokeStyle = '#fff'; g.lineWidth = 4; g.lineCap = 'round'; for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3; g.beginPath(); g.moveTo(32 - Math.cos(a) * 26, 32 - Math.sin(a) * 26); g.lineTo(32 + Math.cos(a) * 26, 32 + Math.sin(a) * 26); g.stroke(); } }),
  fire: canvasTex(64, (g, s) => { const r = g.createRadialGradient(32, 40, 2, 32, 36, 26); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.5, 'rgba(255,255,255,.6)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.beginPath(); g.moveTo(32, 4); g.quadraticCurveTo(54, 34, 46, 50); g.quadraticCurveTo(32, 64, 18, 50); g.quadraticCurveTo(10, 34, 32, 4); g.fill(); }),
  shock: canvasTex(128, (g, s) => { const r = g.createRadialGradient(64, 64, 30, 64, 64, 62); r.addColorStop(0, 'rgba(255,255,255,0)'); r.addColorStop(.7, 'rgba(255,255,255,.9)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, s, s); }),
};

/* ================================================================ toy models ================================================================ */
const BOXG = new THREE.BoxGeometry(1, 1, 1);
const LIN = h => new THREE.Color(h).convertSRGBToLinear(), HSL = (h, s, l) => new THREE.Color().setHSL(h, s, l).convertSRGBToLinear();
const lumS = c => { const s = c.clone().convertLinearToSRGB(); return .299 * s.r + .587 * s.g + .114 * s.b; };
const DARK = c => lumS(c) < .13;
function matFor(b) {
  const f = b.flags, m = new THREE.MeshStandardMaterial({ color: LIN(b.col), roughness: f.includes('F') ? .95 : .55, metalness: 0, envMapIntensity: .55 });
  if (f.includes('M')) { m.metalness = .78; m.roughness = .28; m.envMapIntensity = 1; }
  if (f.includes('N')) { m.emissive = LIN(b.col); m.emissiveIntensity = .95; }
  if (f.includes('G')) { m.transparent = true; m.opacity = .45; m.roughness = .08; m.depthWrite = false; }
  m.userData.base = { color: m.color.clone(), emissive: m.emissive.clone(), ei: m.emissiveIntensity, rough: m.roughness, metal: m.metalness, opacity: m.opacity, transparent: m.transparent };
  return m;
}
function buildToy(t) {
  const sh = shapeOf(t), s = sh.scale, nodes = {}, meshes = [];
  const fadeNames = new Set((t.Idle || []).filter(tr => tr[1] === 'Fade').map(tr => tr[0]));
  const make = (nd, pp, fading) => {
    const g = new THREE.Group(); g.name = nd.name; nodes[nd.name] = g;
    g.position.set((nd.pivot[0] - pp[0]) * s, (nd.pivot[1] - pp[1]) * s, (nd.pivot[2] - pp[2]) * s);
    g.userData.base = g.position.clone(); g.userData.meshes = []; g.userData.pivot = nd.pivot;
    const fade = fading || fadeNames.has(nd.name);
    nd.boxes.forEach(b => {
      const me = new THREE.Mesh(BOXG, matFor(b));
      me.scale.set(Math.max(.02, b.w * s), Math.max(.02, b.h * s), Math.max(.02, b.d * s));
      me.position.set((b.x + b.w / 2 - nd.pivot[0]) * s, (b.y + b.h / 2 - nd.pivot[1]) * s, (b.z + b.d / 2 - nd.pivot[2]) * s);
      if (b.rot) me.rotation.set(b.rot[0] * Math.PI / 180, b.rot[1] * Math.PI / 180, b.rot[2] * Math.PI / 180);
      me.castShadow = me.receiveShadow = true; me.userData.box = b;
      if (fade) { me.material.transparent = true; me.material.userData.base.transparent = true; }
      // toy-space centre (studs, feet at the origin), used by stripes, rainbow and cosmic colouring
      me.userData.c = new THREE.Vector3((b.x + b.w / 2 - sh.root.pivot[0]) * s, (b.y + b.h / 2 - sh.root.pivot[1]) * s, (b.z + b.d / 2 - sh.root.pivot[2]) * s);
      g.add(me); meshes.push(me); g.userData.meshes.push(me);
    });
    nd.children.forEach(c => { const cg = make(c, nd.pivot, fade); g.add(cg); });
    return g;
  };
  const body = make(sh.root, sh.root.pivot, false);
  body.position.set(0, 0, 0); body.userData.base = new THREE.Vector3();
  const outer = new THREE.Group(); outer.add(body);
  outer.userData = { toy: t, nodes, meshes, s, size: new THREE.Vector3(...sh.size), body, rfx: [], mfx: [], mut: 'None', fadeNames };
  // the toy's own particles (ToyPalette.Fx presets), e.g. steam from a teapot spout; they follow their group
  outer.userData.tfx = (t.Fx || []).map(([name, pt, grp, rate]) => {
    const P = DATA.palette.Fx[name], g = nodes[grp || 'Body'] || body;
    if (!P) { console.warn(t.Id + ': unknown Fx ' + name); return null; }
    const a = new THREE.Object3D(), pv = g.userData.pivot || sh.root.pivot; a.position.set((pt[0] - pv[0]) * s, (pt[1] - pv[1]) * s, (pt[2] - pv[2]) * s); g.add(a);
    return new Emitter(outer, { tex: P.Texture.toLowerCase(), rate: rate || P.Rate, life: P.Life, size: P.Size, grow: P.Grow, vel: P.Velocity, spread: P.Spread, accel: P.Accel,
      fade: (P.Fade || 'InOut').toLowerCase(), normal: !P.Glow, alpha: P.Alpha, colors: P.Colors, world: true, from: 'point',
      point: () => { outer.updateMatrixWorld(); return outer.worldToLocal(a.getWorldPosition(new THREE.Vector3())); } });
  }).filter(Boolean);
  return outer;
}
function groupMeshes(g) { const out = []; g.traverse(o => { if (o.isMesh && o.userData.box) out.push(o); }); return out; }

/* Idle animation: the same wave maths as ToyAnimator.luau. Tracks are { target, channel, amp, speed, wave, phase, duty }. */
function wave(kind, a, sp, ph, duty, t) {
  const x = sp * t + ph, D = duty || 0.3;
  switch (kind) {
    case 'Abs': return a * Math.abs(Math.sin(x));
    case 'Pos': return a * Math.max(0, Math.sin(x));
    case 'Lift': return a * (1 - Math.cos(x)) / 2;

  if (kind === 'sheet' || kind === 'blanket') { const s = SETS.find(x => x.id === set); return { title: s ? s.name : set, sub: kind === 'blanket' ? 'Under the blanket · Epic and up leak a glow' : `${s ? s.toys.length : 0} toys · rarity effects on`,
    cells: (s ? s.toys : []).map(t => ({ t, mut: 'None', blanket: kind === 'blanket' })) }; }
  if (kind === 'muts') { const t = BY_ID[toyId] || TOYS[0]; return { title: `${t.Name}: every mutation`, sub: 'Mutations roll once at wake-up', cells: ['None', ...MORDER].map(m => ({ t, mut: m, fx: false })) }; }
  if (kind === 'rarity') return { title: 'Rarity effects', sub: 'Ring, sparkles, aura, embers and light by rarity', cells: RORDER.map(r => ({ t: TOYS.find(x => x.Rarity === r) || TOYS[0], mut: 'None', label: r })) };
  if (kind === 'toy') { const t = BY_ID[toyId] || TOYS[0]; return { title: '', sub: '', cells: [{ t, mut: Q.get('mut') || 'None' }] }; }
  if (kind === 'reveal') { const t = BY_ID[toyId] || TOYS[0], steps = [[1.2, 'Blanket shakes'], [1.62, 'Burst'], [1.85, 'Pop'], [3.2, 'Awake']];
    return { title: `The wake-up reveal: ${t.Name}`, sub: `${t.Rarity} · the burst is in the rarity colour`, cells: steps.map(([k, label]) => ({ t, mut: Q.get('mut') || 'None', reveal: k, label })) }; }
  return { title: '', sub: '', cells: [] };
}
// Run the wake-up reveal (the same steps as the Reveal view) up to time k, then leave it frozen for a still.
function simulateReveal(o, bl, k) {
  const H = o.userData.size.y, r = o.userData.toy.Rarity, col = RCOL[r], dt = 1 / 60;
  let fx = [], burst = false;
  for (let t = 0; t <= k; t += dt) {
    if (t < 1.5) { o.visible = false; const a = smooth(clamp01(t / 1.5));
      bl.rotation.z = Math.sin(t * 38) * .05 * a; bl.rotation.x = Math.sin(t * 31) * .04 * a; bl.scale.set(1 + Math.sin(t * 17) * .04 * a, 1 + Math.sin(t * 21) * .07 * a, 1);
      bl.userData.tell && bl.userData.tell(t, a * a); continue; }
    if (!burst) { burst = true; bl.visible = false; o.visible = true; o.updateMatrixWorld(true);
      const n = { Common: 14, Uncommon: 20, Rare: 28, Epic: 38, Legendary: 52, Mythic: 66, Secret: 84 }[r];
      const conf = new Emitter(o, { tex: 'square', rate: 0, life: 1.6, size: [.35, .55], from: 'center', vel: [0, 12, 0], spread: 15, drag: 2.2, accel: -9, spin: true, fade: 'out', normal: true, world: true, floor: true, colors: r === 'Secret' ? 'rainbow' : [col, col, '#FFFFFF'] });
      const spk = new Emitter(o, { tex: 'sparkle', rate: 0, life: 1, size: [.8, 1.4], from: 'volume', vel: [0, 1.5, 0], spread: 2.5, fade: 'twinkle', colors: r === 'Secret' ? 'rainbow' : [col, '#FFFFFF'] });
      conf.burst(n); spk.burst(Math.round(n / 3));
      const ring = fxRing(o, LIN(col), 1, 1, 'shock'), flash = fxSprite(o, 'glow', LIN(col), H * 2.4, .55); flash.position.y = H * .5;
      const L = new THREE.PointLight(LIN(col), 3, H * 3, 1.2); L.position.y = H * .6; o.add(L);
      fx = [conf, spk, { update(d, tt) { const q = clamp01((tt - 1.5) / .7), s = (Math.max(o.userData.size.x, o.userData.size.z) + 4) * (.4 + 3.2 * q);
        ring.scale.set(s, s, 1); ring.material.opacity = 1 - q; flash.material.opacity = .55 * (1 - clamp01((tt - 1.5) / .45)); L.intensity = 3 * (1 - clamp01((tt - 1.5) / .5)); } }]; }
    const p = t - 1.5, pop = p < .35 ? .25 + .9 * Math.sin(Math.PI / 2 * p / .35) : 1 + .15 * Math.max(0, 1 - (p - .35) / .25) * Math.cos((p - .35) * 18);
    o.scale.setScalar(Math.max(.2, Math.min(1.2, pop)));
    stepToy(o, dt, t); fx.forEach(f => f.update(dt, t));

}
// Icons: every toy in the set (or all) in its rest pose, no floor or effects, on a transparent background, in a grid of
// square cells in data order. tools/toys/make-icons.sh screenshots this and cuts it into design/toy-icons/<Id>.png.
function startIcons(W) {
  const set = Q.get('set') || 'All', cell = +Q.get('cell') || 256, cols = Math.floor(W / cell), list = set === 'All' ? TOYS : TOYS.filter(t => t.set === set);
  document.body.style.background = 'transparent';
  list.forEach((t, i) => {
    const st = makeStage({ bg: null }); st.scene.background = null; st.floor.visible = false; st.key.shadow.mapSize.set(512, 512);
    const cam = new THREE.PerspectiveCamera(30, 1, .1, 600), o = buildToy(t); o.rotation.y = -.45; st.scene.add(o); frameCam(cam, o.userData.size, .84);
    const x = (i % cols) * cell, y = Math.floor(i / cols) * cell, yy = renderer.domElement.height - y - cell;
    renderer.setViewport(x, yy, cell, cell); renderer.setScissor(x, yy, cell, cell); renderer.setScissorTest(true); renderer.setClearColor(0, 0); renderer.clear(); renderer.render(st.scene, cam);
  });

}
function startShot(kind) {
  document.body.classList.add('shot'); document.getElementById('app').hidden = true; document.getElementById('sheet').hidden = false;
  const cv = document.getElementById('sheetcv'), W = +Q.get('w') || window.innerWidth, H = +Q.get('h') || window.innerHeight;
  renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true, alpha: kind === 'icons', premultipliedAlpha: false });
  if (kind === 'icons') { renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.shadowMap.enabled = true; renderer.outputEncoding = THREE.sRGBEncoding; renderer.autoClear = false; ENV = makeEnv(renderer); return startIcons(W); }
  renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputEncoding = THREE.sRGBEncoding; renderer.autoClear = false;
  ENV = makeEnv(renderer);
  if (kind === 'lineup') return startLineup(W, H);
  const spec = shotCells(kind), n = spec.cells.length, labels = document.getElementById('labels');
  if (spec.title) labels.insertAdjacentHTML('beforeend', `<div class="sheettitle"><small>${spec.sub}</small>${spec.title}</div>`);
  const top = spec.title ? 70 : 0, cols = n <= 1 ? 1 : n <= 4 ? n : n <= 8 ? 4 : n <= 10 ? 5 : n <= 12 ? 4 : 5, rows = Math.ceil(n / cols);
  const cw = W / cols, ch = (H - top) / rows, labH = n > 1 ? 58 : 0;
  const cells = spec.cells.map((c, i) => {
    const st = makeStage({ bg: 0x232A55 }), cam = new THREE.PerspectiveCamera(30, cw / (ch - labH), .1, 600), o = buildToy(c.t);
    o.rotation.y = -.35; st.scene.add(o); setRarityFx(o, c.fx !== false && !c.blanket); setMutation(o, c.mut); fitFloor(st, o);
    let bl = null; if (c.blanket || c.reveal) { o.visible = !!c.reveal; bl = makeBlanket(o); bl.rotation.y = o.rotation.y; st.scene.add(bl); }
    const sz = o.userData.size.clone(); if (bl) { const bb = new THREE.Box3().setFromObject(bl.children[1]); sz.set(bb.max.x - bb.min.x, bb.max.y - bb.min.y, bb.max.z - bb.min.z); const r = Math.max(sz.x, sz.z) * .62 + 2; st.floor.scale.set(r / 24, 1, r / 24); }
    if (c.reveal) { setRarityFx(o, true); simulateReveal(o, bl, c.reveal); }
    frameCam(cam, sz, n > 1 ? .95 : 1.1);
    const x = (i % cols) * cw, y = top + Math.floor(i / cols) * ch;
    if (n > 1) { const m = MUTS[c.mut], t = c.t;
      labels.insertAdjacentHTML('beforeend', `<div class="lab" style="left:${x + cw / 2}px;top:${y + ch - labH}px"><b>${c.label ? c.label : c.mut !== 'None' && kind === 'muts' ? m.Name + ' x' + m.Multiplier : kind === 'muts' ? 'No mutation' : t.Name}</b>
        <span>${kind === 'muts' ? (m ? (m.Event ? (m.Chance * 100) + '% in event' : (m.Chance * 100) + '%') : 'base') : `${rarityPill(t.Rarity)} ${money(t.Money)}/s · ${SIZE_NAME[t.Size]}`}</span></div>`); }
    return { st, cam, o, bl, x, y, w: cw, h: ch - labH, ph: i * .7, frozen: !!c.reveal };
  });
  const clk = new THREE.Clock(); let last = 0, frames = 0;
  (function frame() {
    requestAnimationFrame(frame); const t = clk.getElapsedTime() + 1.2, dt = Math.min(.05, t - last); last = t;
    renderer.setScissorTest(false); renderer.setClearColor(0x141936); renderer.clear(); renderer.setScissorTest(true);
    cells.forEach(c => { if (!c.frozen) stepToy(c.o, dt, t + c.ph); if (c.bl && !c.frozen) { c.bl.scale.y = 1 + Math.sin(t * 1.6) * .02; c.bl.userData.tell && c.bl.userData.tell(t, .85); }
      const yy = H - c.y - c.h; renderer.setViewport(c.x + 3, yy + 3, c.w - 6, c.h - 6); renderer.setScissor(c.x + 3, yy + 3, c.w - 6, c.h - 6); renderer.render(c.st.scene, c.cam); });
    if (frames === 2 && WARN.length) labels.insertAdjacentHTML('beforeend', `<div style="position:absolute;right:16px;top:12px;max-width:760px;background:#B3122E;color:#fff;font:500 13px var(--mono);padding:8px 12px;border-radius:8px">${[...new Set(WARN)].slice(0, 12).join('<br>')}</div>`);
    if (++frames === 40) document.title = 'ready';
  })();
}
function startLineup(W, H) {
  const set = Q.get('set') || 'Bedroom', s = SETS.find(x => x.id === set), toys = s ? s.toys : [];
  const objs = toys.map(t => { const o = buildToy(t); setRarityFx(o, true); return o; });
  let x = 0; const gap = 3, placed = [];
  const m = mouseFigure(); placed.push([m, 2.4]);
  objs.forEach(o => placed.push([o, Math.max(o.userData.size.x, o.userData.size.z) * .8]));
  const total = placed.reduce((a, [, w]) => a + w + gap, 0) - gap;
  const st = makeStage({ bg: 0x232A55, floorR: total * .62 + 10, shadowR: total * .6 + 6, shadow: 2048 });
  placed.forEach(([o, w]) => { o.position.set(x + w / 2 - total / 2, 0, 0); o.rotation.y = o === m ? 0 : -.5; st.scene.add(o); x += w + gap; });
  const maxH = Math.max(...objs.map(o => o.userData.size.y), 5), cam = new THREE.PerspectiveCamera(22, W / H, .1, 2000);
  const d = Math.max(total * .5 / Math.tan(THREE.MathUtils.degToRad(22) * W / H / 2) * 1.08, maxH * 3);
  cam.position.set(0, maxH * .9 + d * .16, d); cam.lookAt(0, maxH * .4, 0);
  document.getElementById('labels').insertAdjacentHTML('beforeend', `<div class="sheettitle"><small>At real scale · the mouse is a player (5 studs)</small>${s ? s.name : set}</div>`);
  const clk = new THREE.Clock(); let last = 0, frames = 0;
  (function frame() { requestAnimationFrame(frame); const t = clk.getElapsedTime() + 1.2, dt = Math.min(.05, t - last); last = t;
    objs.forEach((o, i) => stepToy(o, dt, t + i * .7)); renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H); renderer.clear(); renderer.render(st.scene, cam); if (++frames === 40) document.title = 'ready'; })();
}

if (Q.get('shot')) startShot(Q.get('shot')); else startInteractive();
